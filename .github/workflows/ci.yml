name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint y pruebas unitarias. Los e2e no corren aqui: necesitan el PostgreSQL
  # compartido y su sitio es la maquina de quien desarrolla. El despliegue
  # (imagenes en GHCR y CD al VPS) llega con docs/plans/06.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # prisma.config.ts exige DATABASE_URL aunque `generate` no se conecte.
      - run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
